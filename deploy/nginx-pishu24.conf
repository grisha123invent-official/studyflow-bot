# Конфигурация nginx (лендинг + веб-админка + кабинет редактора + webhook Робокассы)
# 1. Скопируйте: cp deploy/nginx-pishu24.conf /etc/nginx/sites-available/studyflow
# 2. Включите: ln -s /etc/nginx/sites-available/studyflow /etc/nginx/sites-enabled/
# 3. Выпустите SSL: certbot --nginx -d example.com

server {
    listen 80;
    server_name example.com www.example.com;

    access_log /var/log/nginx/studyflow-access.log;
    error_log  /var/log/nginx/studyflow-error.log;

    client_max_body_size 25M;

    # Result URL вебхук от Робокассы → проксируем в процесс бота (порт 8080)
    location /robokassa/result {
        proxy_pass http://127.0.0.1:8080/robokassa/result;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Веб-платформа FastAPI: лендинг (/), оферта (/oferta), оплата (/pay/*),
    # панель администратора (/admin) и кабинет редактора (/editor)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }

    # Безопасные заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Сжатие
    gzip on;
    gzip_types text/css application/javascript text/html text/plain image/svg+xml;
    gzip_min_length 1024;

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        return 404;
    }
}
