services:
  bot:
    build: .
    container_name: studyflow-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=data/bot.db
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    ports:
      - "${PAYMENT_WEBHOOK_PORT:-8080}:8080"
    command: ["python", "main.py"]

  web:
    build: .
    container_name: studyflow-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=data/bot.db
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    ports:
      - "${ADMIN_WEB_PORT:-8081}:8081"
    command: ["uvicorn", "web.main:app", "--host", "0.0.0.0", "--port", "8081", "--proxy-headers", "--forwarded-allow-ips=*"]
